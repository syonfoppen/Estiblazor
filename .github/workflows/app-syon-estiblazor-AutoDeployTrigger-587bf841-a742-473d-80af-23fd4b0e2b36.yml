name: Deploy to Azure (manual)
on:
  workflow_dispatch:
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit production configuration
        env:
          REDIS: ${{ secrets.ESTIBLAZOR_REDIS }}
          KEYS: ${{ vars.ESTIBLAZOR_KEYS_PATH }}
          PUBLIC_URL: ${{ vars.ESTIBLAZOR_PUBLIC_URL }}
        run: |
          test -n "$REDIS" || { echo "Configure ESTIBLAZOR_REDIS first"; exit 1; }
          test -n "$PUBLIC_URL" || { echo "Configure ESTIBLAZOR_PUBLIC_URL to the canonical HTTPS origin first"; exit 1; }
          test -n "$KEYS" || { echo "Configure ESTIBLAZOR_KEYS_PATH on a persistent mounted volume first"; exit 1; }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPSYONESTIBLAZOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPSYONESTIBLAZOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPSYONESTIBLAZOR_AZURE_SUBSCRIPTION_ID }}
      - name: Configure existing app for persistent rooms
        env:
          REDIS: ${{ secrets.ESTIBLAZOR_REDIS }}
          KEYS: ${{ vars.ESTIBLAZOR_KEYS_PATH }}
        run: |
          MOUNTS=$(az containerapp show --name app-syon-estiblazor --resource-group rg-syon-estiblazor --query 'properties.template.containers[].volumeMounts[].mountPath' -o tsv)
          echo "$MOUNTS" | grep -Fx -- "$KEYS" >/dev/null || { echo "Persistent key mount is missing"; exit 1; }
          az containerapp secret set --name app-syon-estiblazor --resource-group rg-syon-estiblazor --secrets "estiblazor-redis=$REDIS" --output none
          az containerapp update --name app-syon-estiblazor --resource-group rg-syon-estiblazor --min-replicas 1 --max-replicas 1 --output none
      - uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: src/Dockerfile
          registryUrl: registry-1.docker.io
          registryUsername: ${{ secrets.APPSYONESTIBLAZOR_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APPSYONESTIBLAZOR_REGISTRY_PASSWORD }}
          containerAppName: app-syon-estiblazor
          resourceGroup: rg-syon-estiblazor
          imageToBuild: registry-1.docker.io/syonfoppen02/estiblazorui:${{ github.sha }}
          environmentVariables: ConnectionStrings__Redis=secretref:estiblazor-redis DataProtection__KeysPath=${{ vars.ESTIBLAZOR_KEYS_PATH }} Cookies__Secure=true Site__PublicUrl=${{ vars.ESTIBLAZOR_PUBLIC_URL }} Accessibility__ContactUrl=${{ vars.ESTIBLAZOR_ACCESSIBILITY_CONTACT || 'https://github.com/syonfoppen/Estiblazor/issues/new' }}
      - name: Enforce one replica
        run: az containerapp update --name app-syon-estiblazor --resource-group rg-syon-estiblazor --min-replicas 1 --max-replicas 1
